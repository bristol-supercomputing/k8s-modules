name: Release Helm chart

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/release-chart.yaml"
  # PRs also trigger on the image inputs (the same list as build.yaml) so
  # every PR that gets pr-<number> images also gets a matching PR chart.
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/release-chart.yaml"
      - "Dockerfile"
      - "Dockerfile.nri"
      - ".dockerignore"
      - ".github/workflows/build.yaml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "test/**"
  workflow_dispatch:

env:
  CHART_DIR: deploy/helm/k8s-modules

permissions:
  contents: read

jobs:
  lint:
    name: Lint and template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint "$CHART_DIR"

      # Rendering catches template errors that `helm lint` alone does not.
      - name: Template (defaults)
        run: helm template k8s-modules "$CHART_DIR" --namespace module-system > /dev/null

      - name: Template (PVC modules, pull secrets, split namespaces)
        run: |
          helm template k8s-modules "$CHART_DIR" --namespace kube-system \
            --set modulesNamespace=module-system \
            --set 'nri.pvcs={spack-apps,other-claim}' \
            --set 'imagePullSecrets[0].name=ghcr' > /dev/null

  # Same-repo PRs publish a prerelease chart, <version>-pr.<number>, the chart
  # counterpart of build.yaml's pr-<number> image tags, so a PR can be
  # test-deployed end to end without merging. Fork PRs are excluded for the
  # same reason build.yaml excludes them from pushing.
  pr-chart:
    name: Publish PR chart
    needs: lint
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the chart to ghcr.io as an OCI artifact

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff against the base branch below

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # Pin the chart to the pr-<number> images only when this PR changes an
      # image input, because build.yaml publishes that tag only then. A
      # chart-only PR keeps the default image tags so it never points at an
      # image that does not exist. Keep this pattern in sync with build.yaml's
      # paths filter.
      - name: Point the chart at this PR
        id: chart
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          name=$(yq -r '.name' "$CHART_DIR/Chart.yaml")
          version="$(yq -r '.version' "$CHART_DIR/Chart.yaml")-pr.${PR}"
          yq -i ".version = \"${version}\"" "$CHART_DIR/Chart.yaml"
          image_re='^(Dockerfile|Dockerfile\.nri|\.dockerignore|\.github/workflows/build\.yaml|Makefile|go\.mod|go\.sum|api/|cmd/|internal/|test/|deploy/helm/)'
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE "$image_re"; then
            yq -i ".appVersion = \"pr-${PR}\"" "$CHART_DIR/Chart.yaml"
            yq -i ".image.tag = \"pr-${PR}\" | .nri.image.tag = \"pr-${PR}\"" "$CHART_DIR/values.yaml"
            image_tag="pr-${PR}"
          else
            image_tag=$(yq -r '.appVersion' "$CHART_DIR/Chart.yaml")
          fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Package
        run: helm package "$CHART_DIR" --destination /tmp/chart

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push chart to ghcr.io
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: helm push "/tmp/chart/${CHART}-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - name: Summary
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          IMAGE_TAG: ${{ steps.chart.outputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          PR chart \`${CHART}\` ${VERSION} (image tag \`${IMAGE_TAG}\`):

          \`\`\`bash
          helm upgrade --install k8s-modules oci://ghcr.io/${OWNER}/charts/${CHART} \\
            --version ${VERSION} --namespace module-system --create-namespace
          \`\`\`
          EOF

  # The chart is distributed as an OCI artifact on ghcr.io rather than an
  # HTTP chart repository: a private repo's GitHub Pages site cannot serve an
  # index whose tarballs need authentication, while OCI needs no Pages.
  release:
    name: Package and publish
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      packages: write # push the chart to ghcr.io as an OCI artifact

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to tell whether this version is released

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Read chart version
        id: chart
        run: |
          name=$(helm show chart "$CHART_DIR" | yq -r '.name')
          version=$(helm show chart "$CHART_DIR" | yq -r '.version')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$name-$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name-$version is already released; bump version in $CHART_DIR/Chart.yaml to publish a new one."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.chart.outputs.released == 'false'
        run: helm package "$CHART_DIR" --destination /tmp/chart

      - name: Log in to ghcr.io
        if: steps.chart.outputs.released == 'false'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push chart to ghcr.io
        if: steps.chart.outputs.released == 'false'
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: helm push "/tmp/chart/${CHART}-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      # Published after the push, so a failed push does not leave a release
      # advertising a chart that is not there. The tarball is attached for
      # archival; the OCI reference is the supported way to install.
      - name: Create GitHub release
        if: steps.chart.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          notes=$(cat <<EOF
          Helm chart \`${CHART}\` ${VERSION}. Its default images are the
          \`v$(helm show chart "$CHART_DIR" | yq -r '.appVersion')\` release of module-controller and module-nri.

          \`\`\`bash
          helm install k8s-modules oci://ghcr.io/${OWNER}/charts/${CHART} \\
            --version ${VERSION} --namespace module-system --create-namespace
          \`\`\`

          Nodes need containerd's NRI default validator enabled; see the chart README.
          EOF
          )
          gh release create "${CHART}-${VERSION}" \
            --title "${CHART} ${VERSION}" \
            --notes "$notes" \
            "/tmp/chart/${CHART}-${VERSION}.tgz"
