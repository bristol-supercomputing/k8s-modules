apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata: {name: spike-add-limits}
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
    - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
  matchConditions:
  - name: annotated
    expression: "has(object.metadata.annotations) && 'spike/load' in object.metadata.annotations"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: |
        Object{
          spec: Object.spec{
            containers: object.spec.containers.map(c, Object.spec.containers{
              name: c.name,
              resources: Object.spec.containers.resources{
                limits: {"modules.isambard.ac.uk/nccl-2.29.2": "1"},
                requests: {"modules.isambard.ac.uk/nccl-2.29.2": "1"}
              }
            })
          }
        }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata: {name: spike-add-limits}
spec: {policyName: spike-add-limits}
