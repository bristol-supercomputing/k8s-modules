apiVersion: v1
kind: Pod
metadata: {name: multi, namespace: spike}
spec:
  restartPolicy: Never
  containers:
  - name: a
    image: docker.io/library/busybox:1.37
    command: [sh, -c, "echo ENV-a; env | grep -E 'SPIKE|LD_LIB'; sleep 3600"]
    resources: {requests: {modules.isambard.ac.uk/nccl-2.29.2: "1"}, limits: {modules.isambard.ac.uk/nccl-2.29.2: "1"}}
  - name: b
    image: docker.io/library/busybox:1.37
    command: [sh, -c, "echo ENV-b; env | grep -E 'SPIKE|LD_LIB'; sleep 3600"]
    resources: {requests: {modules.isambard.ac.uk/nccl-2.29.2: "1", modules.isambard.ac.uk/aws-ofi-nccl-1.18.0: "1"}, limits: {modules.isambard.ac.uk/nccl-2.29.2: "1", modules.isambard.ac.uk/aws-ofi-nccl-1.18.0: "1"}}
  - name: c
    image: docker.io/library/busybox:1.37
    command: [sh, -c, "echo ENV-c; env | grep -E 'SPIKE|LD_LIB'; sleep 3600"]
---
