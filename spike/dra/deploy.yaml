apiVersion: v1
kind: Namespace
metadata: {name: spike-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: spike-driver, namespace: spike-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: spike-driver}
rules:
- {apiGroups: ["resource.k8s.io"], resources: ["resourceslices"], verbs: ["get","list","watch","create","update","patch","delete"]}
- {apiGroups: ["resource.k8s.io"], resources: ["resourceclaims"], verbs: ["get","list","watch"]}
- {apiGroups: [""], resources: ["nodes"], verbs: ["get","list","watch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: spike-driver}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: spike-driver}
subjects: [{kind: ServiceAccount, name: spike-driver, namespace: spike-system}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: spike-driver, namespace: spike-system}
spec:
  selector: {matchLabels: {app: spike-driver}}
  template:
    metadata: {labels: {app: spike-driver}}
    spec:
      serviceAccountName: spike-driver
      containers:
      - name: driver
        image: kind-registry:5000/spike-driver:dev
        imagePullPolicy: Always
        securityContext: {privileged: true}
        env:
        - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        volumeMounts:
        - {name: plugins, mountPath: /var/lib/kubelet/plugins/modules.isambard.ac.uk}
        - {name: registry, mountPath: /var/lib/kubelet/plugins_registry}
        - {name: cdi, mountPath: /var/run/cdi}
        - {name: nri, mountPath: /var/run/nri}
      volumes:
      - {name: plugins, hostPath: {path: /var/lib/kubelet/plugins/modules.isambard.ac.uk, type: DirectoryOrCreate}}
      - {name: registry, hostPath: {path: /var/lib/kubelet/plugins_registry}}
      - {name: cdi, hostPath: {path: /var/run/cdi, type: DirectoryOrCreate}}
      - {name: nri, hostPath: {path: /var/run/nri}}
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata: {name: module-nccl-2.29.2}
spec:
  selectors: [{cel: {expression: 'device.driver == "modules.isambard.ac.uk" && device.attributes["modules.isambard.ac.uk"].module == "nccl-2.29.2"'}}]
  extendedResourceName: modules.isambard.ac.uk/nccl-2.29.2
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata: {name: module-aws-ofi-nccl-1.18.0}
spec:
  selectors: [{cel: {expression: 'device.driver == "modules.isambard.ac.uk" && device.attributes["modules.isambard.ac.uk"].module == "aws-ofi-nccl-1.18.0"'}}]
  extendedResourceName: modules.isambard.ac.uk/aws-ofi-nccl-1.18.0
