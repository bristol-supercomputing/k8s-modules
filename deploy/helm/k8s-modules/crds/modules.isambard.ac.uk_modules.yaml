---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: modules.modules.isambard.ac.uk
spec:
  group: modules.isambard.ac.uk
  names:
    kind: Module
    listKind: ModuleList
    plural: modules
    singular: module
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.family
      name: Family
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Resolved")].status
      name: Resolved
      type: string
    - jsonPath: .status.conditions[?(@.type=="Resolved")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Module is a versioned bundle of shared libraries that pods can
          load.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              access:
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels are namespace labels; empty means every
                      namespace.
                    maxProperties: 16
                    type: object
                type: object
              dependsOn:
                description: DependsOn lists exact Module names.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              env:
                properties:
                  prependPath:
                    additionalProperties:
                      description: PathList is a list of relative paths.
                      items:
                        maxLength: 256
                        pattern: ^[A-Za-z0-9._+-][A-Za-z0-9._/+-]*$
                        type: string
                      maxItems: 16
                      type: array
                    description: PrependPath maps LD_LIBRARY_PATH to paths relative
                      to the mount path.
                    maxProperties: 1
                    type: object
                    x-kubernetes-validations:
                    - message: only LD_LIBRARY_PATH may be prepended
                      rule: self.all(k, k == 'LD_LIBRARY_PATH')
                    - message: prependPath entries must not contain '..' segments
                      rule: self.all(k, self[k].all(p, !p.split('/').exists(s, s ==
                        '..')))
                  set:
                    additionalProperties:
                      type: string
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: env.set names must match ^[A-Za-z][A-Za-z0-9_]*[A-Za-z0-9]$
                        and be at most 63 characters
                      rule: self.all(k, k.size() <= 63 && k.matches('^[A-Za-z][A-Za-z0-9_]*[A-Za-z0-9]$'))
                    - message: env.set may not set LD_PRELOAD, LD_LIBRARY_PATH, LD_AUDIT
                        or PATH
                      rule: self.all(k, !(k in ['LD_PRELOAD', 'LD_LIBRARY_PATH', 'LD_AUDIT',
                        'PATH']))
                type: object
              family:
                maxLength: 40
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                type: string
              maskPaths:
                description: MaskPaths are absolute container paths, applied in phase
                  3.
                items:
                  maxLength: 256
                  pattern: ^/[A-Za-z0-9._/+-]*$
                  type: string
                maxItems: 32
                type: array
              source:
                properties:
                  host:
                    properties:
                      discover:
                        properties:
                          roots:
                            items:
                              maxLength: 128
                              pattern: ^lib[A-Za-z0-9_.+-]+\.so(\.[0-9]+)*$
                              type: string
                            maxItems: 32
                            minItems: 1
                            type: array
                        required:
                        - roots
                        type: object
                      preferHost:
                        description: |-
                          PreferHost lists dependency sonames placed in lib/ (prepended to
                          LD_LIBRARY_PATH) instead of deps/, for when the image's copy is known
                          to be incompatible.
                        items:
                          maxLength: 128
                          pattern: ^lib[A-Za-z0-9_.+-]+\.so(\.[0-9]+)*$
                          type: string
                        maxItems: 16
                        type: array
                    required:
                    - discover
                    type: object
                  image:
                    properties:
                      reference:
                        maxLength: 512
                        pattern: ^[^;:\s]+(:[0-9]+)?(/[^;:\s]+)*@sha256:[a-f0-9]{64}$
                        type: string
                    required:
                    - reference
                    type: object
                  pvc:
                    properties:
                      claimName:
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      subPath:
                        maxLength: 256
                        minLength: 1
                        pattern: ^[A-Za-z0-9._+-][A-Za-z0-9._/+-]*$
                        type: string
                        x-kubernetes-validations:
                        - message: subPath must not contain '..' segments
                          rule: '!self.split(''/'').exists(s, s == ''..'')'
                    required:
                    - claimName
                    - subPath
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of image, host or pvc must be set
                  rule: '[has(self.image), has(self.host), has(self.pvc)].filter(x,
                    x).size() == 1'
              version:
                description: |-
                  A version ending in .family would give the Module the DeviceClass
                  name of family <family>-<version minus .family>.
                maxLength: 20
                pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: spec.version may not end in .family
                  rule: '!self.endsWith(''.family'')'
            required:
            - family
            - source
            - version
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: a module cannot depend on itself
              rule: '!has(self.dependsOn) || !((self.family + ''-'' + self.version)
                in self.dependsOn)'
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              resolved:
                description: Resolved is the flattened closure of a Module.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  env:
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  modules:
                    items:
                      type: string
                    type: array
                  mounts:
                    items:
                      properties:
                        mountPath:
                          type: string
                        name:
                          type: string
                      required:
                      - mountPath
                      - name
                      type: object
                    type: array
                  volumes:
                    items:
                      properties:
                        name:
                          type: string
                        reference:
                          type: string
                      required:
                      - name
                      - reference
                      type: object
                    type: array
                required:
                - annotations
                - modules
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be <spec.family>-<spec.version>
          rule: self.metadata.name == self.spec.family + '-' + self.spec.version
    served: true
    storage: true
    subresources:
      status: {}
