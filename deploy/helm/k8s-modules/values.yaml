image:
  repository: ghcr.io/isambard-sc/module-controller
  tag: ""
  pullPolicy: IfNotPresent
# Secrets (in the release namespace and in modulesNamespace) for pulling the
# controller and module-nri images, e.g. from a private ghcr.io package.
imagePullSecrets: []
modulesNamespace: module-system
registryAllowlist:
  - ghcr.io/isambard-sc/modules/
envPrefixAllowlist: [NCCL_, FI_, CXIP_, UCX_, OMPI_]
controller:
  replicas: 1
  leaderElect: true
  resources: {}
nri:
  image:
    repository: ghcr.io/isambard-sc/module-nri
    tag: ""
    pullPolicy: IfNotPresent
  hookDir: /opt/brics-modules/bin
  pvcs: []
  discoveryInterval: 10m
  resources: {}
