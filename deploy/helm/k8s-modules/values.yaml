image:
  repository: ghcr.io/bristol-supercomputing/module-controller
  tag: ""
  pullPolicy: IfNotPresent
modulesNamespace: module-system
registryAllowlist:
  - registry.isambard/modules/
envPrefixAllowlist: [NCCL_, FI_, CXIP_, UCX_, OMPI_]
controller:
  replicas: 1
  leaderElect: true
  resources: {}
nri:
  image:
    repository: ghcr.io/bristol-supercomputing/module-nri
    tag: ""
    pullPolicy: IfNotPresent
  hookDir: /opt/brics-modules/bin
  pvcs: []
  discoveryInterval: 10m
  resources: {}
